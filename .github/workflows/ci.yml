name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-ml.txt is only for the ranker prototype and its tests;
        # the index jobs (index.yml / full-rebuild.yml) must not install it.
        run: pip install -r requirements.txt -r requirements-ml.txt pytest

      - name: Run tests
        run: python -m pytest -q
