name: similar-code-check

# Reusable PR check: warn when a PR adds code that is near-identical to
# something that already exists in another indexed repo. Advisory only —
# emits ::warning:: annotations + a Step Summary table, never fails.
#
# Adopt in any org repo with:
#
#   name: similar-code
#   on: pull_request
#   jobs:
#     similar:
#       uses: ippoan/code-search-index/.github/workflows/similar-code-check.yml@main
#
# The index DB and the embedding model come from public release assets and
# actions/cache; no secrets are required.

on:
  workflow_call:
    inputs:
      threshold:
        description: "cosine similarity threshold for a warning"
        type: string
        default: "0.93"
  # allow testing the check from this repo's own PRs
  pull_request:

jobs:
  similar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout code-search-index
        uses: actions/checkout@v4
        with:
          repository: ippoan/code-search-index
          path: .code-search-index

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .code-search-index/requirements.txt

      - name: Install dependencies
        run: pip install -r .code-search-index/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-jina-embeddings-v2-base-code-v1

      - name: Download index DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download index -R ippoan/code-search-index \
            -p code-index.db.gz -O code-index.db.gz
          gunzip -f code-index.db.gz

      - name: Similar-code check
        env:
          PYTHONPATH: .code-search-index
          FASTEMBED_CACHE: /home/runner/.cache/fastembed
        run: |
          python -m indexer.similar --db code-index.db \
            --repo "${{ github.repository }}" \
            --base "origin/${{ github.base_ref || github.event.repository.default_branch }}" \
            --threshold "${{ inputs.threshold || '0.93' }}" --md similar.md
